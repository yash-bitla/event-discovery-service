[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "event-discovery"
version = "0.1.0"
description = "Event search service with quota-aware ingestion from a rate-limited API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yash Bitla" }]
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
eds = "event_discovery.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/event_discovery"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src", "tests", "benchmarks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
